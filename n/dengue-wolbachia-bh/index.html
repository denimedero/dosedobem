<title>Mosquito com bactéria reduz em 68% as infecções por dengue em BH | Dose do Bem</title>
<meta name="description" content="Estudo com 5.757 crianças de 6 a 11 anos em Belo Horizonte mostrou que a soltura de mosquitos Aedes aegypti com a bactéria Wolbachia cortou as infecções por dengue em 68,5% e por chikungunya em 73,3%. A pesquisa é liderada pela UFMG, com Fiocruz e o World Mosquito Program.">
